spring.application.name=booking
server.port=8083
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.config.import=optional:file:.env[.properties]
management.endpoints.web.exposure.include=health

# Datasource Configuration
spring.datasource.url=${BOOKING_DATABASE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_CONFIG_DDL:validate}
spring.jpa.show-sql=${JPA_CONFIG_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=${UI_DOCUMENTATION_ENABLE:false}
springdoc.swagger-ui.enabled=${UI_DOCUMENTATION_ENABLE:false}
springdoc.api-docs.version=OPENAPI_3_1

#Pageable limit
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=20

# Services
hotel.services.catalog-url=${CATALOG_SERVICE_URL:http://localhost:8082}
hotel.services.availability-url=${AVAILABILITY_SERVICE_URL:http://localhost:8084}
hotel.services.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer