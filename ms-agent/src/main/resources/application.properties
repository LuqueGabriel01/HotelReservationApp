spring.application.name=ms-agent
server.port=8086
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.config.import=optional:file:.env[.properties]
management.endpoints.web.exposure.include=health

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=${UI_DOCUMENTATION_ENABLE:false}
springdoc.swagger-ui.enabled=${UI_DOCUMENTATION_ENABLE:false}
springdoc.api-docs.version=OPENAPI_3_1

# Redis configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Gemini API
gemini.api-key=${GEMINI_API_KEY}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-3.5-flash-lite
gemini.temperature=0.7
gemini.max-output-tokens=1024
gemini.timeout-ms=15000

# ms-catalog client
service.catalog.base-url=${CATALOG_SERVICE_URL:http://localhost:8082}

# Chat session
chat.session-ttl-minutes=30