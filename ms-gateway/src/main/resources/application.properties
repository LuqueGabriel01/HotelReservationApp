spring.application.name=ms-gateway
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.config.import=optional:file:.env[.properties]
management.endpoints.web.exposure.include=health

# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# Redis Rate Limiter Parameters
hotel.gateway.rate-limiter.replenish-rate=${GATEWAY_REPLENISH_RATE:2}
hotel.gateway.rate-limiter.burst-capacity=${GATEWAY_BURST_CAPACITY:20}
hotel.gateway.rate-limiter.request-token=${GATEWAY_REQUEST_TOKEN:1}

# Gateway Configuration
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=${GATEWAY_CONNECT_TIMEOUT:3000}
spring.cloud.gateway.server.webflux.httpclient.response-timeout=${GATEWAY_RESPONSE_TIMEOUT:5s}

# Gateway Services
hotel.gateway.service.auth=${AUTH_SERVICE_URL}
hotel.gateway.service.agent=${AGENT_SERVICE_URL}
hotel.gateway.service.availability=${AVAILABILITY_SERVICE_URL}
hotel.gateway.service.booking=${BOOKING_SERVICE_URL}
hotel.gateway.service.catalog=${CATALOG_SERVICE_URL}

# Configuration Base Circuit Breaker
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state.seconds=15
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3

# Instances for each circuitbreaker services
resilience4j.circuitbreaker.instances.auth-cb.baseConfig=default
resilience4j.circuitbreaker.instances.agent-cb.baseConfig=default
resilience4j.circuitbreaker.instances.availability-cb.baseConfig=default
resilience4j.circuitbreaker.instances.booking-cb.baseConfig=default
resilience4j.circuitbreaker.instances.catalog-cb.baseConfig=default

# Timeout global
resilience4j.timelimiter.configs.default.timeout-duration=3s

#Gateway JWT
hotel.gateway.jwt.secret=${JWT_SECRET}
hotel.gateway.jwt.token-prefix=${JWT_TOKEN_TYPE:Bearer}

# Cors Configuration
hotel.gateway.cors.allowed-methods=${GATEWAY_ALLOWED_METHODS}
hotel.gateway.cors.allowed-origins=${GATEWAY_ALLOWED_ORIGINS}
hotel.gateway.cors.max-age=${GATEWAY_MAX_AGE:3600}

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=${UI_DOCUMENTATION_ENABLE:false}
springdoc.swagger-ui.enabled=${UI_DOCUMENTATION_ENABLE:false}
springdoc.api-docs.version=OPENAPI_3_1