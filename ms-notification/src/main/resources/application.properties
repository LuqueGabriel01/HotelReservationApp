spring.application.name=ms-notification
server.port=8085
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.config.import=optional:file:.env[.properties]
management.endpoints.web.exposure.include=health

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=${UI_DOCUMENTATION_ENABLE:false}
springdoc.swagger-ui.enabled=${UI_DOCUMENTATION_ENABLE:false}
springdoc.api-docs.version=OPENAPI_3_1

# Kafka Consumer
spring.kafka.consumer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=ms-notification-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.hotelreservation.msnotification.dtos
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Mail (Brevo SMTP)
spring.mail.host=${EMAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_SESSION}
spring.mail.password=${EMAIL_EXTERNAL_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false