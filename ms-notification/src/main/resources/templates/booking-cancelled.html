<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Reservation Cancelled</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Arial, sans-serif;">
<table role="presentation" style="width:100%; background-color:#f4f4f4; padding:30px 0; border-spacing:0;">
    <tr>
        <td style="text-align:center;">
            <table role="presentation" style="width:600px; background-color:#ffffff; border-radius:8px; overflow:hidden; border-spacing:0;">

                <tr>
                    <td style="background-color:#c0392b; padding:24px; text-align:center;">
                        <h1 style="color:#ffffff; margin:0; font-size:22px;">Hotel Reservation App</h1>
                    </td>
                </tr>

                <tr>
                    <td style="padding:32px;">
                        <h2 style="color:#2c3e50; margin-top:0;">Your reservation has been cancelled</h2>
                        <p style="color:#555555; font-size:15px; line-height:1.5;">
                            Hi <span th:text="${username}">username</span>, your booking at
                            <strong th:text="${hotelName}">Hotel Name</strong> has been cancelled.
                        </p>

                        <table role="presentation" style="width:100%; margin-top:20px; border-spacing:0; border-collapse:collapse;">
                            <tr style="background-color:#f8f9fa;">
                                <td style="padding:8px; color:#888888; font-size:13px;">Room</td>
                                <td style="padding:8px; color:#2c3e50; font-size:14px; text-align:right;" th:text="${roomName}">Room Name</td>
                            </tr>
                            <tr>
                                <td style="padding:8px; color:#888888; font-size:13px;">Check-in</td>
                                <td style="padding:8px; color:#2c3e50; font-size:14px; text-align:right;" th:text="${checkIn}">2025-03-10</td>
                            </tr>
                            <tr style="background-color:#f8f9fa;">
                                <td style="padding:8px; color:#888888; font-size:13px;">Check-out</td>
                                <td style="padding:8px; color:#2c3e50; font-size:14px; text-align:right;" th:text="${checkOut}">2025-03-15</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="background-color:#f8f9fa; padding:16px; text-align:center;">
                        <p style="color:#999999; font-size:12px; margin:0;">
                            Hotel Reservation App · This is an automated message, please do not reply.
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
